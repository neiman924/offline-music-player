name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK with a stable filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tunestack-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tunestack-debug-apk
          path: Tunestack-debug.apk
          if-no-files-found: error
          retention-days: 30
